<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X帖匣 · Postcase</title>
  <link rel="stylesheet" href="ui-tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="xpd-popup xpd-surface">
  <header class="header">
    <img class="header-icon" src="icons/icon48.png" width="32" height="32" alt="">
    <div class="brand-wordmark">
      <h1 data-i18n="brand_name">X帖匣 · Postcase</h1>
      <span class="brand-purpose">X → Markdown</span>
    </div>
  </header>

  <div class="status loading" id="status" role="status" aria-live="polite">
    <span class="status-dot" aria-hidden="true"></span>
    <span id="statusText" data-i18n="checking">检测中…</span>
    <span class="status-type" id="statusKind" hidden></span>
  </div>

  <main>
    <section class="format-section" aria-labelledby="formatLabel">
      <h2 id="formatLabel" data-i18n="download_format">下载格式</h2>
      <div class="mode-selector" id="modeSelector" role="group" aria-label="下载格式" aria-describedby="modeDesc" data-i18n-aria-label="download_format">
        <button type="button" class="mode-btn" data-mode="link" aria-pressed="false" data-i18n="mode_link">图片链接</button>
        <button type="button" class="mode-btn active" data-mode="embed" aria-pressed="true" data-i18n="mode_embed">内嵌图片</button>
        <button type="button" class="mode-btn" data-mode="zip" aria-pressed="false" data-i18n="mode_zip">ZIP 打包</button>
      </div>
      <p class="mode-desc" id="modeDesc" data-i18n="mode_embed_desc">图片写入 Markdown，保存为一个文件。</p>
      <p class="metadata-note" data-i18n="metadata_note">附带作者、时间和原文链接</p>
    </section>

    <div class="buttons-row">
      <button type="button" class="btn btn-primary" id="downloadBtn" disabled data-i18n="download">下载</button>
      <button type="button" class="btn btn-secondary" id="copyBtn" disabled aria-describedby="copyHint" data-i18n="copy">复制</button>
    </div>
    <p class="copy-hint" id="copyHint" data-i18n="copy_link_hint">复制始终使用图片链接。</p>

    <div class="progress" id="progress" role="status" aria-live="polite" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span id="progressText" data-i18n="progress_extracting">正在提取内容…</span>
      <button type="button" class="cancel-btn" id="cancelBtn" disabled data-i18n="cancel">取消</button>
      <progress class="progress-bar" id="progressBar" max="1" value="0" hidden></progress>
    </div>
    <div class="result" id="result" role="status" aria-live="polite" hidden></div>
  </main>

  <footer class="footer">
    <button type="button" class="utility-btn" id="refreshBtn" disabled data-i18n="refresh_page">刷新页面</button>
    <button type="button" class="utility-btn" id="diagnosticBtn" disabled data-i18n="diagnostics_copy">复制诊断报告</button>
    <span id="versionText"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
